; ESP32 CYD 2432S028R - Touchscreen Space Invaders
; Board: ESP32-WROOM-32 + ILI9341 240x320 + XPT2046 touch
; Display: MOSI 23, MISO 19, SCK 18, TFT_CS 15, TFT_DC 2, BL 21
; Touch:   T_CS 33, T_IRQ 36 (shared SPI)
; Speaker: 26 (optional beeps)

[env:cyd-2432s028]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
upload_speed = 921600

; Use max available flash for app (3.9MB app, no OTA) — full memory for game
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = dio

build_flags =
  -O2
  -DCORE_DEBUG_LEVEL=0
  -DLGFX_USE_V1
  -DTFT_BL=21

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
